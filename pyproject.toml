[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-magopt-demo"
version = "0.2.0"
description = "Constraint-aware QAOA demonstrator for information-aware magnetic navigation in GNSS-denied environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Ghadimi" }]
keywords = [
  "quantum-optimization",
  "qaoa",
  "magnetic-navigation",
  "fisher-information",
  "gnss-denied",
  "qubo",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/miladghadimi/q-magopt-demo"

[project.scripts]
qmagopt-demo = "scripts.run_demo:main"

[tool.setuptools.packages.find]
include = ["qmagopt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # The QAOA and QUBO code follows the notation of the papers it implements, where
  # single uppercase names (Q, J, A, F) are the standard symbols.
  "E741",
  "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
ignore_missing_imports = true
files = ["qmagopt"]
