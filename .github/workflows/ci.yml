name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=qmagopt --cov-report=term-missing

      - name: Smoke-run the demo and the benchmark
        run: |
          python scripts/run_demo.py --quick
          python scripts/run_demo.py --quick --information-objective d_optimal
          python scripts/benchmark.py --quick

      - name: Upload generated figures
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
